# ==============================================================================
# Manager (文件管理器主界面)
# ==============================================================================
[mgr]
# 当前工作目录 (顶部栏) - 蓝色
cwd = { fg = "#61afef" }

# 鼠标悬停/光标选中的行 - 深灰色背景
hovered = { bg = "#3e4452" }
preview_hovered = { underline = true }

# 搜索查找时的高亮
find_keyword = { fg = "#e5c07b", italic = true } # 黄色
find_match   = { fg = "#e06c75", bold = true }   # 红色

# 标签页
tab_active   = { fg = "#282c34", bg = "#61afef" } # 黑字蓝底
tab_inactive = { fg = "#abb2bf", bg = "#3e4452" } # 白字灰底
tab_width    = 1

# 边框样式 (默认使用前景色，这里设为深灰色以保持低调)
border_symbol = "│"
border_style  = { fg = "#5c6370" }

# ==============================================================================
# Mode (左下角模式指示器)
# ==============================================================================
[mode]
# 普通模式 - 蓝色
normal_main = { fg = "#282c34", bg = "#61afef", bold = true }
normal_alt  = { fg = "#61afef", bg = "#3e4452" }

# 选择模式 - 绿色
select_main = { fg = "#282c34", bg = "#98c379", bold = true }
select_alt  = { fg = "#98c379", bg = "#3e4452" }

# 待定模式 - 红色
unset_main  = { fg = "#282c34", bg = "#e06c75", bold = true }
unset_alt   = { fg = "#e06c75", bg = "#3e4452" }

# ==============================================================================
# Status (底部状态栏)
# ==============================================================================
[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3e4452", bg = "#3e4452" }

# 进度条
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#61afef", bg = "#3e4452" }
progress_error  = { fg = "#e06c75", bg = "#3e4452" }

# 权限信息
perm_type  = { fg = "#56b6c2" } # 青色
perm_read  = { fg = "#98c379" } # 绿色
perm_write = { fg = "#e5c07b" } # 黄色
perm_exec  = { fg = "#e06c75" } # 红色
perm_sep   = { fg = "#5c6370" } # 灰色

# ==============================================================================
# File Type (根据文件类型着色)
# ==============================================================================
[filetype]
rules = [
    # 图片 - 紫色
    { mime = "image/*", fg = "#c678dd" },

    # 视频/音频 - 紫色/粉色
    { mime = "video/*", fg = "#c678dd" },
    { mime = "audio/*", fg = "#c678dd" },

    # 压缩包 - 红色
    { mime = "application/zip", fg = "#e06c75" },
    { mime = "application/gzip", fg = "#e06c75" },
    { mime = "application/x-tar", fg = "#e06c75" },
    { mime = "application/x-bzip", fg = "#e06c75" },
    { mime = "application/x-bzip2", fg = "#e06c75" },
    { mime = "application/x-7z-compressed", fg = "#e06c75" },
    { mime = "application/x-rar", fg = "#e06c75" },
    { mime = "application/x-xz", fg = "#e06c75" },

    # 文档/PDF - 橙色/黄色
    { mime = "application/pdf", fg = "#e5c07b" },
    { mime = "application/doc", fg = "#e5c07b" },

    # 文件夹 - 蓝色 (必须放在较前位置，或者特定匹配)
    { name = "*/", fg = "#61afef", bold = true },

    # 兜底 - 普通文本颜色
    { name = "*", fg = "#abb2bf" }
]

# ==============================================================================
# Input & Select (输入框与选择菜单)
# ==============================================================================
[input]
border   = { fg = "#61afef" }
title    = {}
value    = { fg = "#abb2bf" }
selected = { bg = "#3e4452" }

[select]
border   = { fg = "#61afef" }
active   = { fg = "#c678dd" } # 选中项紫色
inactive = {}
